<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Planning an event? Send The Daily Grind Café an enquiry for catering and event bookings and we will get back to you soon.">
    <title>Enquiries | The Daily Grind Café</title>

    <link rel="stylesheet" href="../Assets/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header>
        <p>The Daily Grind Café</p>
        <nav>
            <a href="../index.html">Home</a>
            <a href="./menu.html">Menu</a>
            <a href="./about.html">About Us</a>
            <a href="./contact.html">Contact</a>
            <a href="./enquiry.html">Enquiries</a>
        </nav>
    </header>

    <hr>

    <main>
        <h1>Event & Catering Enquiry</h1>
        <p>Want to book our space for a meetup or order fresh catering? Fill out the form below and our team will get back to you.</p>
        
        <!-- Form Intake Section -->
        <form action="#" method="POST" data-validate="enquiry">
            <p>
                <label for="name">Full Name:</label><br>
                <input type="text" id="name" required placeholder="Enter your full name">
            </p>

            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" required placeholder="name@example.com">
            </p>

            <p>
                <label for="enquiry-type">What are you enquiring about?</label><br>
                <select id="enquiry-type">
                    <option value="catering">Event Catering</option>
                    <option value="venue">Café Venue Hire</option>
                    <option value="bulk">Bulk Pastry Orders</option>
                    <option value="other">General Business Inquiry</option>
                </select>
            </p>

            <p>
                <label for="details">Provide More Details:</label><br>
                <textarea id="details" rows="6" required placeholder="Please include expected dates, times, and number of guests..."></textarea>
            </p>

            <p>
                <button type="submit">Submit My Enquiry</button>
            </p>
        </form>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 The Daily Grind Café. All Rights Reserved.</p>
    </footer>

    <script src="../Assets/script.js" defer></script>
</body>
</html>
